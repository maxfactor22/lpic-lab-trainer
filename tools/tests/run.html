<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell Comparison Tests</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111; --ok: #0a7d32; --bad: #b3261e; --line: #ddd; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1020; --fg: #e8ebf5; --ok: #6fd6a6; --bad: #ff9393; --line: #26304d; } }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.2rem; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { margin: 4px 0; white-space: pre-wrap; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>Practice shell vs. real GNU/Bash output</h1>
  <p>Serve the app folder (<code>python3 -m http.server</code>) and open <code>/tools/tests/run.html</code>. Each case was recorded from the real tools; the shell runs in batch mode (like <code>bash -c</code>).</p>
  <table><thead><tr><th>Suite</th><th>Result</th><th>Differences</th></tr></thead><tbody id="rows"></tbody></table>
  <script src="../../js/core.js"></script>
  <script src="../../js/hash.js"></script>
  <script src="../../js/shell.js"></script>
  <script src="../../js/commands-text.js"></script>
  <script src="../../js/commands-find.js"></script>
  <script src="../../js/commands-files.js"></script>
  <script src="../../js/commands-archive.js"></script>
  <script src="../../js/editor.js"></script>
  <script src="../../js/commands-perms.js"></script>
  <script src="../../data/docs.js"></script>
  <script>
    const F4 = { "~/w/patch-reboots.txt": "server3 10\nserver1 2\nserver2 30\nserver5 1\nserver4 12\n", "~/w/users-sample.txt": "root:x:0:0:root:/root:/bin/bash\nmax:x:1000:1000:Max:/home/max:/bin/bash\nsvcbackup:x:998:998:Backup Service:/srv/backup:/usr/sbin/nologin\nappuser:x:1001:1001:Application User:/opt/app:/bin/bash\n", "~/w/incident-log.txt": "Aug 19 08:01 server1 sshd: Failed password for invalid user admin\nAug 19 08:03 server1 sshd: Accepted password for max\nAug 19 08:05 server2 kernel: disk warning sda\nAug 19 08:07 server3 sshd: Failed password for root\nAug 19 08:09 server2 app: ERROR database timeout\n", "~/w/server-list.txt": "server1\nserver2\nserver3\nserver4\nserver5\n", "~/w/service-list.txt": "web\ndatabase\nnetwork\nbackup\nmonitoring\n" };
    // [file, cwd, files-or-null (null = use the file's own), shared shell across cases, compare stderr]
    const SUITES = [
      ["gnu-section04.json", "~/w", F4, true, false],
      ["bash-section05.json", "~/w", { "~/w/": null }, true, true],
      ["gnu-section06.json", "~/lab", null, false, true],
      ["gnu-section07.json", "~/lab", null, false, true],
      ["gnu-section08.json", "~/lab", null, false, true],
    ];
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    (async () => {
      for (const [name, cwd, givenFiles, shared, withErr] of SUITES) {
        const data = await (await fetch(name, { cache: "reload" })).json();
        const cases = data.cases || data;
        // Big zero-filled images are stored as {zeros: N} to keep the JSON small.
        const files = givenFiles || Object.fromEntries(Object.entries(data.files).map(([k, v]) => [k, v && v.zeros ? "\0".repeat(v.zeros) : v]));
        let sh = new LPIC.Shell({ batch: true, cwd, files });
        const bad = [];
        for (const e of cases) {
          if (!shared) sh = new LPIC.Shell({ batch: true, cwd, files });
          const r = sh.run(e.cmd);
          const out = r.out.filter((x) => x.cls !== "terminal-error" && x.cls !== "terminal-muted").map((x) => x.text).join("\n");
          const err = r.out.filter((x) => x.cls === "terminal-error").map((x) => x.text).join("\n");
          const wantErr = (e.err || "").replace(/\n$/, "").replace(/^\/usr\/bin\/bash: line \d+: /gm, "bash: ");
          if (out !== e.out.replace(/\n$/, "") || (withErr && err !== wantErr)) bad.push({ cmd: e.cmd, want: e.out + (withErr ? wantErr : ""), got: out + (withErr ? err : "") });
        }
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(name)}</td><td class="${bad.length ? "bad" : "ok"}">${cases.length - bad.length}/${cases.length}</td><td>${bad.map((b) => `<div><code>${esc(b.cmd)}</code><pre>want: ${esc(b.want)}\ngot:  ${esc(b.got)}</pre></div>`).join("")}</td>`;
        document.querySelector("#rows").append(tr);
      }
      // vi: replay each keystroke script through the simulator and compare the file vim wrote.
      const vim = await (await fetch("vim-section09.json", { cache: "reload" })).json();
      const vbad = [];
      for (const c of vim.cases) {
        const vi = new LPIC.ViModel(c.start, { path: "t.txt", rows: 22 });
        vi.readFile = () => null; vi.writeFile = () => ({});
        for (const ch of c.keys) vi.key(ch === "\x1b" ? "Escape" : ch === "\n" ? "Enter" : ch);
        if (vi.mode !== "normal") vi.key("Escape");
        if (vi.text() !== c.result && !vim.known.includes(c.keys)) vbad.push({ cmd: JSON.stringify(c.keys), want: c.result, got: vi.text() });
      }
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>vim-section09.json</td><td class="${vbad.length ? "bad" : "ok"}">${vim.cases.length - vim.known.length - vbad.length}/${vim.cases.length - vim.known.length} (+${vim.known.length} known)</td><td>${vbad.map((b) => `<div><code>${esc(b.cmd)}</code><pre>want: ${esc(b.want)}\ngot:  ${esc(b.got)}</pre></div>`).join("")}</td>`;
      document.querySelector("#rows").append(tr);
    })();
  </script>
</body>
</html>
