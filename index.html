<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="LPIC-1 Lab Trainer, all sections">
        <span class="brand-mark" aria-hidden="true">$_</span>
        <span class="brand-text">
          <strong>LPIC-1 Lab Trainer</strong>

        </span>
      </a>

      <div class="progress-summary">
        <div class="progress-meta">
          <span class="progress-title" id="progress-title">Course progress</span>
          <span id="progress-label">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progress-bar"></span>
        </div>
      </div>

      <button class="button button-ghost" id="reset-progress" type="button" hidden>
        <span aria-hidden="true" class="button-icon">↺</span>
        <span>Reset lesson</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="lesson-nav" id="nav" aria-label="Course navigation"></aside>
    <div class="lesson-content" id="view" tabindex="-1">
      <noscript><p class="card">This trainer needs JavaScript turned on.</p></noscript>
    </div>
  </main>
